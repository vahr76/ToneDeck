name: Build ToneDeck

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: -A x64
          - name: macOS
            os: macos-15
            cmake_args: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl-dev

      - name: Fetch dependencies
        shell: bash
        run: bash scripts/fetch_deps.sh

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target ToneDeck_All --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ART=build/ToneDeck_artefacts/Release
          cp -R "$ART/VST3/ToneDeck.vst3" dist/
          [ -d "$ART/AU" ]   && cp -R "$ART/AU/ToneDeck.component" dist/ || true
          [ -d "$ART/CLAP" ] && cp -R "$ART/CLAP/ToneDeck.clap" dist/ || true
          [ -d "$ART/LV2" ]  && cp -R "$ART/LV2/ToneDeck.lv2" dist/ || true
          cp -R "$ART/Standalone/"* dist/
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ToneDeck-${{ matrix.name }}
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
